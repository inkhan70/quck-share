# Memory is deliberately modest: this project must build comfortably on CI runners and
# low-memory containers.
#
# The figures are not arbitrary. A 2 GB container OOM-kills the build when the Gradle daemon and the
# Kotlin daemon are both resident - which is the default - because a 1 GB daemon plus a 512 MB Kotlin
# daemon plus JVM overhead does not fit. Running the Kotlin compiler in-process removes the second
# JVM entirely, so the memory budget is spent on compilation instead of on a second runtime.
org.gradle.jvmargs=-Xmx1250m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1 -Xss1m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
# One worker: R8, AAPT2 and dexing are the other large allocations, and running them concurrently is
# what tips a small container over the edge.
org.gradle.workers.max=1

kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx384m
kotlin.incremental=true
# The VFS watcher holds native buffers outside the Java heap; on a small container those buffers are
# memory the compilers cannot use, and nothing here needs watch mode.
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official
