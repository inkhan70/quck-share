name: Build QuickShare APK

#
# Builds the release APK and, on a tag, attaches it to a GitHub release.
#
# Two things this workflow deliberately does NOT do:
#   * it never commits or prints the signing keystore, and
#   * it fails loudly when the keystore secrets are absent rather than silently falling back to the
#     debug key - an unsigned "release" APK that cannot be installed over an existing one is worse
#     than a red build.
#
concurrency:
  group: quickshare-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Job-level on purpose: a step's own `env` is NOT visible to that same step's `if:`, so the old
    # "Restore the release keystore" condition was always false and the keystore was never written.
    env:
      KEYSTORE_BASE64: ${{ secrets.QUICKSHARE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.QUICKSHARE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.QUICKSHARE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.QUICKSHARE_KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # ----------------------------------------------------------------------------------------
      # Signing. The keystore is materialised from a base64 secret into a path the build reads via
      # keystore.properties, so no credential is ever written into a tracked file.
      # ----------------------------------------------------------------------------------------
      - name: Restore the release keystore and write keystore.properties
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release keystore secret is missing. Add QUICKSHARE_KEYSTORE_BASE64, QUICKSHARE_STORE_PASSWORD, QUICKSHARE_KEY_ALIAS and QUICKSHARE_KEY_PASSWORD in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quickshare-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/quickshare-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 keystore.properties

      - name: Run the unit tests
        run: gradle :core:test :app:test --no-daemon --console=plain

      - name: Assemble the release APK
        run: gradle :app:assembleRelease --no-daemon --console=plain

      - name: Rename the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/QuickShare-Release.apk

      - name: Verify the signature
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose --print-certs out/QuickShare-Release.apk
          "$BT/aapt2" dump badging out/QuickShare-Release.apk | head -20

      - name: Report size and checksum
        run: |
          ls -l out/QuickShare-Release.apk
          sha256sum out/QuickShare-Release.apk | tee out/SHA256SUMS.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickShare-Release-apk
          path: out/QuickShare-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuickShare-checksums
          path: out/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuickShare-test-reports
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: QuickShare-Release-apk
          path: out

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: out/QuickShare-Release.apk
          generate_release_notes: true
